defaults:
  - data_schema  # dataclass DataConfig from vessel_seg.config.schemas
  - _self_

# Relative to the repo root (Hydra >= 1.2 does not chdir by default)
root: data/raw
image_size: 512
mask_threshold: 0.15

# Validation is carved out of train; test stays untouched
val_size: 0.2


batch_size: 16
num_workers: 0

image_transform:
  _target_: vessel_seg.data.transforms.get_image_transform
  _convert_: all  # pass plain lists, not ListConfig, to torchvision
  size: ${data.image_size}
  mean: [0.485, 0.456, 0.406] # from ImageNet
  std: [0.229, 0.224, 0.225]

mask_transform:
  _target_: vessel_seg.data.transforms.get_mask_transform
  size: ${data.image_size}

augmentation_transform:
  _target_: vessel_seg.data.transforms.get_augmentation_transform
  _convert_: all
  size: ${data.image_size}
  degrees: 180
  crop_scale: [ 0.625, 1.0 ]
  crop_p: 1.0
