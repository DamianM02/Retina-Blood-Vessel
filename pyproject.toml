[project]
name = "vessel-seg"
version = "0.1.0"
description = "Retinal blood vessel segmentation with ML: reproducible MLOps pipeline"
readme = "README.md"
authors = [
    { name = "DamianM02", email = "damianmoskala11@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hydra-core==1.4.0rc3",
    "ipykernel>=7.4.0",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
vessel-seg = "vessel_seg:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]


# RUFF
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["notebooks"] # Ignoring preety bad written notebooks
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "NPY", "PT", "RUF"]
ignore = ["N803", "N806", "N812"]

#[tool.ruff.lint.per-file-ignores]
#"notebooks/*" = ["E402"]

[tool.ruff.format]
docstring-code-format = true



# MYPY
[tool.mypy]
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["segmentation_models_pytorch.*", "kagglehub.*", "torchvision.*"]
ignore_missing_imports = true

# PYTEST
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
